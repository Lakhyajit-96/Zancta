<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic gradient for premium feel -->
    <linearGradient id="metallic-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5F5;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#D4D4D4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A8A8A8;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#8C8C8C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#787878;stop-opacity:1" />
    </linearGradient>
    
    <!-- Inner shadow for depth -->
    <filter id="inner-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.5" result="blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="blur" result="inverse"/>
      <feFlood flood-color="#000" flood-opacity="0.3"/>
      <feComposite in2="inverse" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>
  
  <!-- Deep black background -->
  <rect width="80" height="80" fill="#0A0A0A"/>
  
  <!-- Precision Z geometry with angular cuts -->
  <path d="M 60 12 L 20 12 L 20 28 L 52 28 L 28 52 L 28 36 L 12 36 L 12 68 L 68 68 L 68 52 L 36 52 L 60 28 L 60 44 L 76 44 L 76 12 Z" 
        fill="url(#metallic-gradient)"
        filter="url(#inner-shadow)"/>
  
  <!-- Subtle metallic highlight (hairline detail) -->
  <path d="M 20 16 L 52 16 L 28 40 Z" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="0.5" 
        opacity="0.3"/>
  
  <!-- Technical dot accents at corners -->
  <circle cx="12" cy="12" r="1" fill="#404040"/>
  <circle cx="76" cy="12" r="1" fill="#404040"/>
  <circle cx="12" cy="68" r="1" fill="#404040"/>
  <circle cx="76" cy="68" r="1" fill="#404040"/>
</svg>
