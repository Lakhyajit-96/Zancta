<svg viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Subtle depth shadow -->
    <filter id="depth-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.5" result="blur"/>
      <feOffset dx="0" dy="1" result="offsetBlur"/>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Edge bevel for dimension -->
    <linearGradient id="bevel-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#404040;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#606060;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A2A2A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- ZANCTA wordmark - graphite/dark metallic tones for light backgrounds -->
  <text x="10" y="36" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="32" font-weight="700" letter-spacing="4" fill="#2A2A2A" 
        filter="url(#depth-shadow)">
    ZANCTA
  </text>
  
  <!-- Precision accent line with gradient -->
  <line x1="10" y1="42" x2="190" y2="42" stroke="url(#bevel-gradient)" stroke-width="0.5" opacity="0.8"/>
  
  <!-- Corner technical dots -->
  <circle cx="10" cy="42" r="0.8" fill="#3A3A3A" opacity="0.9"/>
  <circle cx="190" cy="42" r="0.8" fill="#3A3A3A" opacity="0.9"/>
  
  <!-- Minimal geometric detail (shield/architecture motif) -->
  <path d="M 188 4 L 194 10 L 188 10 Z" fill="#404040" opacity="0.6"/>
</svg>
