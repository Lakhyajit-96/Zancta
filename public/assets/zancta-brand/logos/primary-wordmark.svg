<svg viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Subtle metallic gradient for sophistication -->
    <linearGradient id="metallic-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E8E8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C0C0C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A8A8A8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle luminous glow -->
    <filter id="subtle-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background depth layer -->
  <rect width="400" height="100" fill="#0A0A0A"/>
  
  <!-- ZANCTA wordmark with precision geometry -->
  <text x="20" y="68" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="52" font-weight="700" letter-spacing="8" fill="url(#metallic-silver)" 
        filter="url(#subtle-glow)" style="font-feature-settings: 'tnum' on, 'lining-nums' on;">
    ZANCTA
  </text>
  
  <!-- Subtle horizontal accent line (technical precision motif) -->
  <line x1="20" y1="78" x2="380" y2="78" stroke="#404040" stroke-width="0.5" opacity="0.6"/>
  
  <!-- Micro dot accents (crafted detail) -->
  <circle cx="20" cy="78" r="0.8" fill="#606060" opacity="0.8"/>
  <circle cx="380" cy="78" r="0.8" fill="#606060" opacity="0.8"/>
</svg>
