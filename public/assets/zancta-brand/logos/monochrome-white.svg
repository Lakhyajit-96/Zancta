<svg viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Subtle luminous glow filter -->
    <filter id="luminous-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Metallic edge highlight -->
    <linearGradient id="edge-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9" />
      <stop offset="10%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
      <stop offset="90%" style="stop-color:#CCCCCC;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#666666;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- ZANCTA wordmark - pure white precision typography -->
  <text x="10" y="36" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="32" font-weight="700" letter-spacing="4" fill="#FFFFFF" 
        filter="url(#luminous-glow)">
    ZANCTA
  </text>
  
  <!-- Precision horizontal line (technical accent) -->
  <line x1="10" y1="42" x2="190" y2="42" stroke="#FFFFFF" stroke-width="0.4" opacity="0.5"/>
  
  <!-- Corner micro-accent dots -->
  <circle cx="10" cy="42" r="0.6" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="190" cy="42" r="0.6" fill="#FFFFFF" opacity="0.7"/>
  
  <!-- Subtle diagonal cut detail (technical motif) -->
  <path d="M 188 4 L 194 10 L 188 10 Z" fill="#FFFFFF" opacity="0.3"/>
</svg>
