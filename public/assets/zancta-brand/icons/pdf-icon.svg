<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic gradient -->
    <linearGradient id="pdf-metallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E8E8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A8A8A8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#787878;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle glow -->
    <filter id="pdf-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Deep black background -->
  <rect width="64" height="64" fill="#0A0A0A"/>
  
  <!-- PDF document icon with technical precision -->
  <g filter="url(#pdf-glow)">
    <!-- Document body -->
    <path d="M 16 8 L 36 8 L 44 16 L 44 52 L 16 52 Z" 
          fill="none" 
          stroke="url(#pdf-metallic)" 
          stroke-width="2.5"/>
    
    <!-- PDF text indicator -->
    <text x="26" y="36" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="14" 
          font-weight="700" 
          letter-spacing="1"
          fill="url(#pdf-metallic)"
          text-anchor="middle">PDF</text>
    
    <!-- Technical corner accents -->
    <line x1="16" y1="8" x2="10" y2="8" stroke="#606060" stroke-width="1"/>
    <line x1="16" y1="8" x2="16" y2="14" stroke="#606060" stroke-width="1"/>
    
    <!-- Micro detail lines (technical motif) -->
    <line x1="20" y1="24" x2="38" y2="24" stroke="#404040" stroke-width="1" opacity="0.6"/>
    <line x1="20" y1="30" x2="34" y2="30" stroke="#404040" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- Corner dot accents -->
  <circle cx="16" cy="52" r="1" fill="#404040"/>
  <circle cx="44" cy="52" r="1" fill="#404040"/>
</svg>
