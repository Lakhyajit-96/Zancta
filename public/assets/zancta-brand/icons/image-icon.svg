<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic gradient -->
    <linearGradient id="img-metallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E8E8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A8A8A8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#787878;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle glow -->
    <filter id="img-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Deep black background -->
  <rect width="64" height="64" fill="#0A0A0A"/>
  
  <!-- Image/photo icon with precision geometry -->
  <g filter="url(#img-glow)">
    <!-- Image frame -->
    <rect x="10" y="14" width="44" height="38" 
          fill="none" 
          stroke="url(#img-metallic)" 
          stroke-width="2.5"
          rx="2"/>
    
    <!-- Mountain/sun motif (photography symbol) -->
    <path d="M 14 40 L 24 30 L 32 36 L 40 24 L 50 40 Z" 
          fill="none" 
          stroke="url(#img-metallic)" 
          stroke-width="2"/>
    
    <!-- Sun circle -->
    <circle cx="36" cy="26" r="4" fill="none" stroke="url(#img-metallic)" stroke-width="1.5"/>
    
    <!-- Technical corner accents -->
    <line x1="10" y1="14" x2="4" y2="14" stroke="#606060" stroke-width="1"/>
    <line x1="10" y1="14" x2="10" y2="8" stroke="#606060" stroke-width="1"/>
    
    <!-- Micro grid detail (technical precision) -->
    <line x1="20" y1="20" x2="20" y2="22" stroke="#404040" stroke-width="0.8" opacity="0.6"/>
    <line x1="44" y1="34" x2="46" y2="34" stroke="#404040" stroke-width="0.8" opacity="0.6"/>
  </g>
  
  <!-- Corner dot accents -->
  <circle cx="10" cy="52" r="1" fill="#404040"/>
  <circle cx="54" cy="52" r="1" fill="#404040"/>
</svg>
