services:
  postgres:
    container_name: zancta-test-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zancta
      POSTGRES_PASSWORD: zancta
      POSTGRES_DB: zancta_test
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zancta -d zancta_test"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
